name: Update profile statistics
# Refresh public profile charts automatically.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-stats.yml'
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate public GitHub statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime, html, json, os, urllib.request
          from collections import Counter

          query = """query($login:String!, $cursor:String) {
            user(login:$login) {
              followers { totalCount }
              repositories(first:100, after:$cursor, ownerAffiliations:OWNER, privacy:PUBLIC, isFork:false) {
                totalCount pageInfo { hasNextPage endCursor }
                nodes { stargazerCount forkCount primaryLanguage { name } languages(first:100, orderBy:{field:SIZE,direction:DESC}) { edges { size node { name } } } }
              }
              contributionsCollection {
                contributionCalendar { totalContributions weeks { contributionDays { contributionCount } } }
                totalCommitContributions totalPullRequestContributions totalIssueContributions totalPullRequestReviewContributions
              }
            }
          }"""
          token = os.environ["GH_TOKEN"]
          cursor, first, stars, forks, langs = None, None, 0, 0, Counter()
          repo_langs = Counter()
          while True:
              payload = json.dumps({"query": query, "variables": {"login": "its-3mran", "cursor": cursor}}).encode()
              req = urllib.request.Request("https://api.github.com/graphql", data=payload, headers={"Authorization": "Bearer " + token, "Content-Type": "application/json", "User-Agent": "profile-stats"})
              with urllib.request.urlopen(req) as response:
                  result = json.load(response)
              if result.get("errors"): raise RuntimeError(result["errors"])
              user = result["data"]["user"]
              if user is None: raise RuntimeError("GitHub user not found")
              if first is None: first = user
              repos = user["repositories"]
              for repo in repos["nodes"]:
                  if repo["primaryLanguage"]: repo_langs[repo["primaryLanguage"]["name"]] += 1
                  stars += repo["stargazerCount"]
                  forks += repo["forkCount"]
                  for edge in repo["languages"]["edges"]: langs[edge["node"]["name"]] += edge["size"]
              if not repos["pageInfo"]["hasNextPage"]: break
              cursor = repos["pageInfo"]["endCursor"]

          c = first["contributionsCollection"]
          values = [
              ("Public repositories", first["repositories"]["totalCount"]),
              ("Repository stars", stars), ("Repository forks", forks),
              ("Followers", first["followers"]["totalCount"]),
              ("Contributions this year", c["contributionCalendar"]["totalContributions"]),
              ("Commits this year", c["totalCommitContributions"]),
              ("Pull requests this year", c["totalPullRequestContributions"]),
              ("Issues this year", c["totalIssueContributions"]),
              ("Reviews this year", c["totalPullRequestReviewContributions"]),
          ]
          updated = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          def esc(value): return html.escape(str(value))
          lines = ['<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-label="GitHub statistics">', '<rect width="800" height="480" rx="18" fill="#0d1117"/>', '<style>text{font-family:Arial,sans-serif}.title{font-size:24px;fill:#00c853;font-weight:700}.label{font-size:15px;fill:#c9d1d9}.value{font-size:23px;fill:#fff;font-weight:700}.foot{font-size:12px;fill:#8b949e}</style>', '<text x="28" y="40" class="title">GitHub Overview</text>']
          for i, (label, value) in enumerate(values):
              x, y = 28 + (i % 3) * 250, 80 + (i // 3) * 72
              lines += [f'<text x="{x}" y="{y}" class="label">{esc(label)}</text>', f'<text x="{x}" y="{y+27}" class="value">{value:,}</text>']
          lines.append('<text x="28" y="315" class="title">Languages in public repositories</text>')
          top = langs.most_common(6)
          total = sum(langs.values())
          if total:
              for i, (name, size) in enumerate(top):
                  x, y = 28 + (i % 3) * 250, 350 + (i // 3) * 40
                  lines.append(f'<text x="{x}" y="{y}" class="label">{esc(name)} · {size / total * 100:.1f}%</text>')
          else:
              lines.append('<text x="28" y="350" class="label">No language data yet</text>')
          lines += [f'<text x="28" y="450" class="foot">Updated {updated} · public data · language percentages by code size</text>', '</svg>']
          os.makedirs("assets", exist_ok=True)
          with open("assets/github-stats.svg", "w", encoding="utf-8") as f: f.write("\n".join(lines) + "\n")
          days = [d for w in c["contributionCalendar"]["weeks"] for d in w["contributionDays"]]
          days = days[-31:]
          peak = max([d["contributionCount"] for d in days] + [1])
          points = [(50 + i * 700 / max(len(days)-1, 1), 220 - d["contributionCount"] * 150 / peak) for i, d in enumerate(days)]
          graph = ['<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-label="Daily contributions for the last 31 days">', '<rect width="800" height="280" rx="18" fill="#0d1117"/>', '<text x="28" y="38" fill="#00c853" font-family="Arial,sans-serif" font-size="22" font-weight="bold">Contribution Activity · Last 31 Days</text>']
          for i in range(4):
              y = 70 + i * 50
              graph.append(f'<line x1="50" y1="{y}" x2="750" y2="{y}" stroke="#30363d"/>')
              graph.append(f'<text x="38" y="{y+4}" text-anchor="end" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">{round(peak * (220-y) / 150)}</text>')
          coords = " ".join(f"{x:.1f},{y:.1f}" for x,y in points)
          if points:
              graph.append(f'<polygon points="50,220 {coords} 750,220" fill="#00c853" fill-opacity=".12"/>')
              graph.append(f'<polyline points="{coords}" fill="none" stroke="#00c853" stroke-width="3" stroke-linejoin="round"/>')
              for x,y in points: graph.append(f'<circle cx="{x:.1f}" cy="{y:.1f}" r="2.5" fill="#fff"/>')
          graph += [f'<text x="50" y="255" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Last {len(days)} days · {sum(d["contributionCount"] for d in days)} contributions</text>', f'<text x="750" y="255" text-anchor="end" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Updated {updated}</text>', '</svg>']
          with open("assets/contribution-activity.svg", "w", encoding="utf-8") as f: f.write("\n".join(graph) + "\n")
          language_svg = ['<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-label="Programming language usage">', '<rect width="800" height="360" rx="18" fill="#0d1117"/>', '<text x="28" y="40" fill="#00c853" font-family="Arial,sans-serif" font-size="22" font-weight="bold">Language Usage · Public Repositories</text>']
          colors = ["#00c853", "#58a6ff", "#bc8cff", "#f2cc60", "#ff7b72", "#79c0ff"]
          if total:
              for i, (name, size) in enumerate(top):
                  y = 78 + i * 42
                  width = size / total * 480
                  language_svg += [f'<text x="28" y="{y+13}" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="14">{esc(name)}</text>', f'<rect x="180" y="{y}" width="480" height="16" rx="8" fill="#21262d"/>', f'<rect x="180" y="{y}" width="{width:.1f}" height="16" rx="8" fill="{colors[i]}"/>', f'<text x="680" y="{y+13}" fill="#fff" font-family="Arial,sans-serif" font-size="14">{size / total * 100:.1f}%</text>']
          else:
              language_svg.append('<text x="28" y="85" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="14">No language data yet</text>')
          language_svg += [f'<text x="28" y="340" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">By code size · public, non-fork repositories · updated {updated}</text>', '</svg>']
          with open("assets/language-usage.svg", "w", encoding="utf-8") as f: f.write("\n".join(language_svg) + "\n")
          compact_top = langs.most_common(8)
          compact = ['<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="Most used languages by code size">', '<rect width="400" height="220" rx="6" fill="#0d1117"/>', '<text x="24" y="33" fill="#00c853" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Most Used Languages</text>']
          palette = ["#f1e05a", "#563d7c", "#a91e50", "#e34c26", "#3178c6", "#3572a5", "#00c853", "#58a6ff"]
          if total:
              left = 24.0
              for i, (name, size) in enumerate(compact_top):
                  width = 352 * size / total
                  compact.append(f'<rect x="{left:.2f}" y="52" width="{width:.2f}" height="8" fill="{palette[i]}"/>')
                  left += width
              for i, (name, size) in enumerate(compact_top):
                  x, y = 24 + (i % 2) * 185, 89 + (i // 2) * 27
                  compact.append(f'<circle cx="{x+4}" cy="{y-4}" r="4" fill="{palette[i]}"/><text x="{x+14}" y="{y}" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="12">{esc(name)} {size / total * 100:.1f}%</text>')
          else:
              compact.append('<text x="24" y="90" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="13">No public language data yet</text>')
          compact.append(f'<text x="24" y="205" fill="#8b949e" font-family="Arial,sans-serif" font-size="10">Public non-fork repositories · updated {updated}</text>')
          compact.append('</svg>')
          with open("assets/language-breakdown.svg", "w", encoding="utf-8") as f: f.write("\n".join(compact) + "\n")
          ranked = repo_langs.most_common(6)
          repo_card = ['<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="Repositories by primary language">', '<rect width="400" height="220" rx="6" fill="#0d1117"/>', '<text x="24" y="33" fill="#00c853" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Repositories per Language</text>']
          if ranked:
              maximum = ranked[0][1]
              for i, (name, count) in enumerate(ranked):
                  y = 57 + i * 23
                  repo_card += [f'<text x="24" y="{y+10}" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="12">{esc(name)}</text>', f'<rect x="140" y="{y}" width="190" height="10" rx="5" fill="#21262d"/>', f'<rect x="140" y="{y}" width="{190 * count / maximum:.1f}" height="10" rx="5" fill="{palette[i]}"/>', f'<text x="343" y="{y+10}" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="12">{count}</text>']
          else:
              repo_card.append('<text x="24" y="85" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="12">No public repository languages yet</text>')
          repo_card += [f'<text x="24" y="208" fill="#8b949e" font-family="Arial,sans-serif" font-size="10">Primary language · updated {updated}</text>', '</svg>']
          with open("assets/repository-languages.svg", "w", encoding="utf-8") as f: f.write("\n".join(repo_card) + "\n")
          PY
      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/contribution-activity.svg assets/language-usage.svg assets/language-breakdown.svg assets/repository-languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update profile statistics"
            git push
          fi
